{% extends "base.html" %}

{% block contenido %}

<h1>Préstamos</h1>

<a
    href="{{ url_for('nuevo_prestamo') }}"
    class="btn btn-success mb-3">
    Nuevo
</a>

<table class="table table-striped">

    <thead class="table-dark">

        <tr>
            <th>Id</th>
            <th>Fecha</th>
            <th>Estudiante</th>
            <th>Libro</th>
            <th>Acciones</th>
        </tr>

    </thead>

    <tbody>

        {% for prestamo in prestamos %}

        <tr>

            <td>{{ prestamo.id }}</td>

            <td>{{ prestamo.fecha }}</td>

            <td>{{ prestamo.estudiante }}</td>

            <td>{{ prestamo.titulo }}</td>

            <td>

                <a
                    href="{{ url_for('eliminar_prestamo', id=prestamo.id) }}"
                    class="btn btn-danger">
                    Eliminar
                </a>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
