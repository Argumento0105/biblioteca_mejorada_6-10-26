{% extends "base.html" %}

{% block contenido %}

<h1>Nuevo estudiante</h1>

<form method="POST">

    <div class="mb-3">

        <label class="form-label">
            Nombre
        </label>

        <input
            type="text"
            name="nombre"
            class="form-control"
            required>

    </div>


    <div class="mb-3">

        <label class="form-label">
            Apellido
        </label>

        <input
            type="text"
            name="apellido"
            class="form-control"
            required>

    </div>


    <div class="mb-3">

        <label class="form-label">
            Correo electrónico
        </label>

        <input
            type="email"
            name="correo"
            class="form-control"
            required>

    </div>


    <button class="btn btn-primary">
        Guardar
    </button>

    <a
        href="{{ url_for('listar_estudiantes') }}"
        class="btn btn-secondary">
        Cancelar
    </a>

</form>

{% endblock %}
