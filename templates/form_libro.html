{% extends "base.html" %}

{% block contenido %}

<h1>Nuevo libro</h1>

<form method="POST">

    <div class="mb-3">

        <label class="form-label">
            Título
        </label>

        <input
            type="text"
            name="titulo"
            class="form-control"
            required>

    </div>


    <div class="mb-3">

        <label class="form-label">
            Autor
        </label>

        <input
            type="text"
            name="autor"
            class="form-control"
            required>

    </div>


    <div class="mb-3">

        <label class="form-label">
            Categoría
        </label>

        <input
            type="text"
            name="categoria"
            class="form-control"
            required>

    </div>


    <div class="mb-3">

        <label class="form-label">
            Año
        </label>

        <input
            type="number"
            name="anio"
            class="form-control"
            required>

    </div>


    <button class="btn btn-primary">
        Guardar
    </button>

    <a
        href="{{ url_for('listar_libros') }}"
        class="btn btn-secondary">
        Cancelar
    </a>

</form>

{% endblock %}
